name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      historical_conformance:
        description: Re-run the archived Python differential corpora
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.target.os }}, Python ${{ matrix.target.python }}, shard ${{ matrix.shard }}/${{ matrix.target.shards }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows-latest, python: "3.12", shards: 3 }
          - { os: ubuntu-latest, python: "3.14", shards: 2 }
          - { os: macos-latest, python: "3.14", shards: 2 }
        shard: [1, 2]
        include:
          - target: { os: windows-latest, python: "3.12", shards: 3 }
            shard: 3
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.target.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - name: Build the real HTTP fixture
        env:
          GOTOOLCHAIN: local
          GOENV: "off"
          CGO_ENABLED: "0"
        run: >-
          python -c "import os,pathlib,shutil,subprocess;
          binary=pathlib.Path(os.environ['RUNNER_TEMP'])/('phalanx-test-server.exe' if os.name=='nt' else 'phalanx-test-server');
          subprocess.run(['go','build','-trimpath','-buildvcs=false','-o',str(binary),'./cmd/phalanx-server'],cwd='server',check=True);
          shutil.copytree('phalanx/static',binary.parent/'assets',dirs_exist_ok=True);
          pathlib.Path(os.environ['GITHUB_ENV']).open('a').write('PHALANX_TEST_SERVER='+str(binary)+'\n')"

      - name: Run tests
        run: python tests/shard.py ${{ matrix.shard }} ${{ matrix.target.shards }}

  envelope:
    name: Envelope probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - name: Build the real HTTP fixture
        env:
          GOTOOLCHAIN: local
          GOENV: "off"
          CGO_ENABLED: "0"
        run: >-
          python -c "import os,pathlib,subprocess;
          binary=pathlib.Path(os.environ['RUNNER_TEMP'])/'phalanx-test-server';
          subprocess.run(['go','build','-trimpath','-buildvcs=false','-o',str(binary),'./cmd/phalanx-server'],cwd='server',check=True);
          pathlib.Path(os.environ['GITHUB_ENV']).open('a').write('PHALANX_TEST_SERVER='+str(binary)+'\n')"

      - name: Run envelope probe once
        run: >-
          python tests/envelope_probe.py
          --executions 1000 --fanout 60 --throttled 2
          --captains 2 --max-writers 2 --duration 20 --throttle-seconds 4
          --outage-seconds 3 --aging-seconds 10 --json-out envelope.json

      - name: Preserve envelope measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: envelope
          path: envelope.json
          if-no-files-found: error

  go-foundation:
    name: Go foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      GOTOOLCHAIN: local
      GOENV: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - name: Build and check the pinned foundation
        working-directory: server
        run: |
          go version
          go mod verify
          go build -trimpath -buildvcs=false ./...
          go vet ./...
          go test -count=1 -json ./... > "${{ runner.temp }}/go-tests.jsonl"

      - name: Preserve native test IDs and durations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/go-tests.jsonl
          if-no-files-found: error

      - name: Race-check admission, storage, and HTTP operations
        if: runner.os != 'Windows'
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  go-runtime-safety:
    name: Go runtime safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      GOTOOLCHAIN: local
      GOENV: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@v7
        if: runner.os != 'Windows'
        with:
          python-version: "3.14"

      - name: Install dependencies for OS-only lock proof
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.lock

      - name: Provision the exact disposable Python/SQLite oracle
        if: runner.os == 'Windows'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "python-oracle-20261110.tar.gz"
          Invoke-WebRequest "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.14.10%2B20261110-x86_64-pc-windows-msvc-install_only_stripped.tar.gz" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne "32b6cf90a03e2bc15fda8d2ab7ff78c4870f138887d612932650ce764efaab8f") { throw "Oracle archive checksum mismatch" }
          $root = Join-Path $env:RUNNER_TEMP "phalanx-oracle-20261110"
          New-Item -ItemType Directory -Path $root | Out-Null
          tar -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $root "python\python.exe"
          & $python -c "import platform,sqlite3; print(platform.python_version(),sqlite3.sqlite_version); assert platform.python_version()=='3.14.10'; assert sqlite3.sqlite_version=='3.53.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m venv (Join-Path $root "venv")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $root "venv\Scripts\python.exe"
          "PHALANX_CONFORMANCE_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Install pinned disposable Python oracle dependencies
        if: runner.os == 'Windows'
        run: '& $env:PHALANX_CONFORMANCE_PYTHON -m pip install -r conformance/requirements.lock'
        working-directory: server

      - name: Prove actual Python-Go sole locks on Unix
        if: runner.os != 'Windows'
        working-directory: server
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/conformance-lock" ./cmd/conformance-server
          python conformance/locks.py --binary "$RUNNER_TEMP/conformance-lock" --output "$RUNNER_TEMP/lock-proof"

      - name: Compare production proxy and home identity on Unix
        if: runner.os != 'Windows'
        working-directory: server
        run: |
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/phalanx-server" ./cmd/phalanx-server
          python conformance/identity.py --binary "$RUNNER_TEMP/phalanx-server" --output "$RUNNER_TEMP/identity-proof"

      - name: Compare production proxy and home identity on Windows
        if: runner.os == 'Windows'
        working-directory: server
        run: |
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\identity-server.exe" ./cmd/phalanx-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON conformance\identity.py --binary "$env:RUNNER_TEMP\identity-server.exe" --output "$env:RUNNER_TEMP\identity-proof"

      - name: Prove isolated existing-task owned-tree stop and original-key restart
        if: runner.os == 'Windows'
        env:
          PHALANX_WINDOWS_TASK_ISOLATION: "1"
        run: |
          $package = Join-Path $env:RUNNER_TEMP "windows-supervisor-package"
          New-Item -ItemType Directory -Path (Join-Path $package "assets") | Out-Null
          Copy-Item phalanx\static\* (Join-Path $package "assets")
          Set-Location server
          go build -trimpath -buildvcs=false -o "$package\phalanx-server.exe" ./cmd/phalanx-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..
          & $env:PHALANX_CONFORMANCE_PYTHON tests\windows_supervisor_rehearsal.py --binary "$package\phalanx-server.exe" --output "$env:RUNNER_TEMP\windows-supervisor-proof"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows supervisor exclusion and replay evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-supervisor-proof
          path: ${{ runner.temp }}/windows-supervisor-proof
          if-no-files-found: error

      - name: Preserve production proxy and identity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-identity-${{ matrix.os }}
          path: ${{ runner.temp }}/identity-proof
          if-no-files-found: error

      - name: Prove actual Python-Go sole locks on Windows
        if: runner.os == 'Windows'
        working-directory: server
        run: |
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-lock.exe" ./cmd/conformance-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON conformance\locks.py --binary "$env:RUNNER_TEMP\conformance-lock.exe" --output "$env:RUNNER_TEMP\lock-proof"

      - name: Preserve OS exclusion evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-lock-${{ matrix.os }}
          path: ${{ runner.temp }}/lock-proof
          if-no-files-found: error

      - name: Compare immutable P0 and D0 oracles and sole-instance locks
        if: runner.os == 'Windows' && inputs.historical_conformance
        run: |
          Set-Location server
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-server.exe" ./cmd/conformance-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\harness.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\conformance-proof"

      - name: Preserve exact synthetic wire and durable evidence
        if: always() && runner.os == 'Windows' && inputs.historical_conformance
        uses: actions/upload-artifact@v6
        with:
          name: go-conformance-windows
          path: ${{ runner.temp }}/conformance-proof
          if-no-files-found: error

      - name: Compare native lifecycle and additional HTTP contracts
        if: runner.os == 'Windows' && inputs.historical_conformance
        run: |
          Set-Location server
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-decisions.exe" ./cmd/conformance-decisions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-json.exe" ./cmd/conformance-json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-models.exe" ./cmd/conformance-models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\history.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\history"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\cancellation.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\cancellation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\inbox.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\inbox"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\writers.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\writers"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\results.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\steering.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\steering"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\captains.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\captains"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\archives.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\archives"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\reconciliation.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\reconciliation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\datetimes.py --binary "$env:RUNNER_TEMP\conformance-models.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\datetimes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\usage.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\usage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\datetimes.py --allow-naive --binary "$env:RUNNER_TEMP\conformance-models.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\datetimes-ordinary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($corpus in @("scout", "flags", "operator_views", "operator_defaults", "scribe", "route_models", "framework", "rehearsal")) {
            & $env:PHALANX_CONFORMANCE_PYTHON "server\conformance\$corpus.py" --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\$corpus"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\decisions.py --binary "$env:RUNNER_TEMP\conformance-decisions.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\decisions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\numbers.py --binary "$env:RUNNER_TEMP\conformance-json.exe" --output "$env:RUNNER_TEMP\domain-conformance-proof\numbers"

      - name: Preserve additional exact domain and HTTP evidence
        if: always() && runner.os == 'Windows' && inputs.historical_conformance
        uses: actions/upload-artifact@v6
        with:
          name: go-domain-conformance-windows
          path: ${{ runner.temp }}/domain-conformance-proof
          if-no-files-found: error

      - name: Package reproducibly and rehearse the real server on current synthetic data
        if: runner.os == 'Windows'
        run: |
          $revision = git rev-parse HEAD
          Set-Location server
          go build -trimpath -buildvcs=false -ldflags "-X main.revision=$revision" -o "$env:RUNNER_TEMP\phalanx-server.exe" ./cmd/phalanx-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -ldflags "-X main.revision=$revision" -o "$env:RUNNER_TEMP\phalanx-server-repeat.exe" ./cmd/phalanx-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$env:RUNNER_TEMP\phalanx-server.exe").Hash -ne (Get-FileHash "$env:RUNNER_TEMP\phalanx-server-repeat.exe").Hash) { throw "Server build is not reproducible" }
          Set-Location ..
          & $env:PHALANX_CONFORMANCE_PYTHON server\package.py --binary "$env:RUNNER_TEMP\phalanx-server.exe" --output "$env:RUNNER_TEMP\server-package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = (Get-ChildItem "$env:RUNNER_TEMP\server-package" -Filter "*.zip").FullName
          $historical = @()
          if ("${{ inputs.historical_conformance }}" -eq "true") { $historical = @("--historical") }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\release.py --package $package --output "$env:RUNNER_TEMP\release-proof" @historical

      - name: Prove production incomplete-header and native framing parity
        if: runner.os == 'Windows'
        run: |
          $historical = @()
          if ("${{ inputs.historical_conformance }}" -eq "true") { $historical = @("--historical") }
          & $env:PHALANX_CONFORMANCE_PYTHON server\conformance\headers.py --binary "$env:RUNNER_TEMP\phalanx-server.exe" --output "$env:RUNNER_TEMP\headers-proof" @historical

      - name: Preserve production header boundaries and complete typed state
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: go-headers-windows
          path: ${{ runner.temp }}/headers-proof
          if-no-files-found: error

      - name: Preserve versioned server package and actual numeric runtime proof
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: go-server-release-windows
          path: |
            ${{ runner.temp }}/server-package
            ${{ runner.temp }}/release-proof
          if-no-files-found: error

  # Historical differential reruns are opt-in; production runtime safety is not.
  tests:
    name: Tests
    if: always()
    needs: [test, envelope, go-foundation, go-runtime-safety]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard and the envelope probe to pass
        if: needs.test.result != 'success' || needs.envelope.result != 'success' || needs.go-foundation.result != 'success' || needs.go-runtime-safety.result != 'success'
        run: |
          echo "::error::Test shards finished with result: ${{ needs.test.result }}"
          echo "::error::Envelope probe finished with result: ${{ needs.envelope.result }}"
          echo "::error::Go foundation finished with result: ${{ needs.go-foundation.result }}"
          echo "::error::Go runtime safety finished with result: ${{ needs.go-runtime-safety.result }}"
          exit 1
