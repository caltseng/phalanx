name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.target.os }}, Python ${{ matrix.target.python }}, shard ${{ matrix.shard }}/${{ matrix.target.shards }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows-latest, python: "3.12", shards: 3 }
          - { os: ubuntu-latest, python: "3.14", shards: 2 }
          - { os: macos-latest, python: "3.14", shards: 2 }
        shard: [1, 2]
        include:
          - target: { os: windows-latest, python: "3.12", shards: 3 }
            shard: 3
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.target.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Run tests
        run: python tests/shard.py ${{ matrix.shard }} ${{ matrix.target.shards }}

  envelope:
    name: Envelope probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .

      - name: Run envelope probe once
        run: >-
          python tests/envelope_probe.py
          --executions 1000 --fanout 60 --throttled 2
          --captains 2 --max-writers 2 --duration 20 --throttle-seconds 4
          --outage-seconds 3 --aging-seconds 10 --json-out envelope.json

      - name: Preserve envelope measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: envelope
          path: envelope.json
          if-no-files-found: error

  go-foundation:
    name: Go foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      GOTOOLCHAIN: local
      GOENV: "off"
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum

      - name: Build and check the pinned foundation
        working-directory: server
        run: |
          go version
          go mod verify
          go build -trimpath -buildvcs=false ./...
          go vet ./...
          go test ./...

      - name: Race-check admission, storage, and HTTP operations
        if: runner.os != 'Windows'
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.14.10"

      - name: Install pinned disposable Python oracle dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.lock

      - name: Compare immutable P0 and D0 oracles and sole-instance locks
        if: runner.os == 'Windows'
        run: |
          Set-Location server
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\conformance-server.exe" ./cmd/conformance-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..
          python server\conformance\harness.py --binary "$env:RUNNER_TEMP\conformance-server.exe" --output "$env:RUNNER_TEMP\conformance-proof"

      - name: Preserve exact synthetic wire and durable evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: go-conformance-windows
          path: ${{ runner.temp }}/conformance-proof
          if-no-files-found: error

  # The single required check covers Python safety, the probe, and Go conformance.
  tests:
    name: Tests
    if: always()
    needs: [test, envelope, go-foundation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard and the envelope probe to pass
        if: needs.test.result != 'success' || needs.envelope.result != 'success' || needs.go-foundation.result != 'success'
        run: |
          echo "::error::Test shards finished with result: ${{ needs.test.result }}"
          echo "::error::Envelope probe finished with result: ${{ needs.envelope.result }}"
          echo "::error::Go foundation finished with result: ${{ needs.go-foundation.result }}"
          exit 1
