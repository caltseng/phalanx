[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phalanx"
version = "0.1.0"
description = "Python clients and offline administration for the Phalanx Go HTTP service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["phalanx"]

[tool.setuptools.package-data]
phalanx = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "prompts/*.md", "windows_task.ps1"]
