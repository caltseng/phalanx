[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phalanx"
version = "0.1.0"
description = "Local HTTP service for Phalanx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["phalanx"]

[tool.setuptools.package-data]
phalanx = ["static/*.html", "static/*.css", "static/*.js", "prompts/*.md"]
